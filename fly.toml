# Fly.io config. Rename `app` to your chosen unique name before first deploy
# (or let `fly launch` set it). Region nrt = Tokyo (low latency to Korea).
app = "catchup-communicator"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

# Run DB migrations before each release.
[deploy]
  release_command = ".venv/bin/alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  # Cost-saving: suspend when idle (no compute charge), resume on the next
  # request. "suspend" restores memory so resume is fast (~1-2s), usually
  # within Slack's 3s window. Set min_machines_running = 1 if you ever see
  # expired_trigger_id from cold resumes.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
